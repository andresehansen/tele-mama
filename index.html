<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tele</title>
  
  <!-- Web App Manifest para instalación PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Tele">

  <!-- Hls.js para reproducción confiable de streams en vivo .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>

  <style>
    /* Reset & Tipografía adaptada para máxima legibilidad */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* VISTA DE CANALES (HOME) */
    #view-home {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header.app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 18px 12px;
    }

    header.app-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-live {
      background: #e11d48;
      color: white;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Cuadrícula ergonómica para temblor esencial */
    /* En vertical (WhatsApp): 2 columnas x 3 filas bien altas sin scroll */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 1fr;
      gap: 16px;
      flex: 1;
    }

    /* En horizontal: 3 columnas x 2 filas */
    @media (orientation: landscape) {
      .channels-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      header.app-header h1 {
        font-size: 2.6rem;
      }
    }

    /* Tarjetas gigantes de canal (Touch Target > 140px) */
    .channel-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      padding: 20px;
      cursor: pointer;
      text-align: center;
      border: 4px solid transparent;
      transition: transform 0.12s ease, border-color 0.12s ease, filter 0.12s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      min-height: 140px;
    }

    /* Estado activo claro al pulsar */
    .channel-card:active, .channel-card.is-pressed {
      transform: scale(0.96);
      border-color: #ffffff;
      filter: brightness(1.15);
    }

    .channel-card .logo-container {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .channel-card .logo-container svg {
      width: 100%;
      height: 100%;
    }

    .channel-card .channel-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      line-height: 1.1;
    }

    .channel-card .channel-subtitle {
      font-size: 1.05rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }

    /* Colores e identidades visuales oficiales por canal */
    .card-tn {
      background: linear-gradient(135deg, #0b2545 0%, #134074 60%, #e65c00 100%);
    }
    .card-telefe {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0284c7 100%);
    }
    .card-c5n {
      background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 60%, #dc2626 100%);
    }
    .card-eltrece {
      background: linear-gradient(135deg, #2a0845 0%, #540d6e 50%, #f72585 100%);
    }
    .card-tvpublica {
      background: linear-gradient(135deg, #075985 0%, #0284c7 50%, #38bdf8 100%);
    }
    .card-canalrural {
      background: linear-gradient(135deg, #14532d 0%, #15803d 60%, #84cc16 100%);
    }

    /* VISTA DE REPRODUCCIÓN (PLAYER) */
    #view-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 1000;
      flex-direction: column;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Capa de controles gigantes sobre el video */
    .player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.85) 100%);
    }

    .player-overlay.hidden {
      opacity: 0;
    }

    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }

    /* BOTÓN VOLVER GIGANTE (Ergonomía temblor: en esquina superior izquierda, lejos de la mano derecha) */
    .btn-giant {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 1.6rem;
      font-weight: 800;
      padding: 16px 32px;
      border-radius: 9999px;
      background: #facc15;
      color: #000000;
      border: 4px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      min-height: 76px;
      min-width: 190px;
    }

    .btn-giant:active {
      transform: scale(0.95);
      background: #eab308;
    }

    .current-channel-info {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 24px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .current-channel-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
    }

    .overlay-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      pointer-events: auto;
    }

    .btn-nav-channel {
      flex: 1;
      max-width: 260px;
      min-height: 72px;
      font-size: 1.35rem;
      font-weight: 700;
      border-radius: 20px;
      background: rgba(30, 41, 59, 0.9);
      color: #ffffff;
      border: 3px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    .btn-nav-channel:active {
      background: #334155;
      transform: scale(0.96);
    }

    /* Mensaje de carga o estado */
    .loading-spinner {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
      background: rgba(0,0,0,0.7);
      padding: 24px 36px;
      border-radius: 24px;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ==================== VISTA PRINCIPAL: GRILLA DE CANALES ==================== -->
  <main id="view-home">
    <header class="app-header">
      <h1>
        📺 Mi Tele
        <span class="badge-live">En Vivo</span>
      </h1>
      <span style="font-size: 1.1rem; color: #94a3b8; font-weight: 600;">Tocá el canal que quieras ver</span>
    </header>

    <section class="channels-grid" id="channels-container">
      <!-- Los canales se renderizan dinámicamente con SVGs de alto contraste -->
    </section>
  </main>

  <!-- ==================== VISTA DE REPRODUCTOR ==================== -->
  <section id="view-player">
    <div class="video-container" id="video-wrapper">
      <video id="tv-video" playsinline webkit-playsinline></video>
      <div id="iframe-wrapper" style="display:none; width: 100%; height: 100%;"></div>

      <div class="loading-spinner" id="player-loading">
        <div class="spinner"></div>
        <span id="loading-text">Conectando canal en vivo...</span>
      </div>

      <!-- Controles sobreimpresos gigantes -->
      <div class="player-overlay" id="player-overlay">
        <!-- Parte Superior: Botón Volver gigante y nombre del canal -->
        <div class="overlay-top">
          <button class="btn-giant" id="btn-back">
            ⬅ VOLVER
          </button>
          
          <div class="current-channel-info">
            <span class="badge-live">VIVO</span>
            <span class="current-channel-name" id="player-channel-name">TN</span>
          </div>
        </div>

        <!-- Parte Inferior: Botones gigantes para cambiar canal rápidamente -->
        <div class="overlay-bottom">
          <button class="btn-nav-channel" id="btn-prev-channel">
            ⏮ Anterior
          </button>
          
          <button class="btn-giant" id="btn-reload-stream" style="background: rgba(255,255,255,0.15); color: #fff; font-size: 1.15rem; min-height: 60px; min-width: 150px; border-color: rgba(255,255,255,0.4);">
            🔄 Reintentar
          </button>

          <button class="btn-nav-channel" id="btn-next-channel">
            Siguiente ⏭
          </button>
        </div>
      </div>
    </div>
  </section>

  <script>
    /* ==========================================================================
       DATOS DE LOS 6 CANALES FAVORITOS
       Identidades visuales, streams HLS primarios y alternativas de YouTube
       ========================================================================== */
    const CHANNELS = [
      {
        id: "tn",
        name: "TN",
        subtitle: "Todo Noticias",
        themeClass: "card-tn",
        // Streams oficiales en alta disponibilidad (HLS y YouTube)
        hlsUrl: "https://live-01-02-tn.vodgc.net/tn/live/playlist.m3u8",
        ytUrl: "https://www.youtube-nocookie.com/embed/live_stream?channel=UCj6P3Gs4nOKcL62qA8BWOnA&autoplay=1",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0b2545"/>
            <path d="M15 15 L85 15 L60 85 L15 85 Z" fill="#e65c00" opacity="0.3"/>
            <text x="50" y="65" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">TN</text>
          </svg>
        `
      },
      {
        id: "telefe",
        name: "Telefe",
        subtitle: "Canal 11",
        themeClass: "card-telefe",
        hlsUrl: "http://45.134.141.161:2200/ARG/TELEFE_HD/index.m3u8",
        fallbackHls: "https://telefe-live.telefe.com/telefe/live/playlist.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="28" cy="50" r="18" fill="#2563eb" />
            <circle cx="50" cy="50" r="18" fill="#16a34a" />
            <circle cx="72" cy="50" r="18" fill="#dc2626" />
            <text x="50" y="86" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">telefe</text>
          </svg>
        `
      },
      {
        id: "c5n",
        name: "C5N",
        subtitle: "Noticias 24hs",
        themeClass: "card-c5n",
        hlsUrl: "https://c5n-live.vodgc.net/c5n/live/playlist.m3u8",
        ytUrl: "https://www.youtube-nocookie.com/embed/live_stream?channel=UCFgk2Q2mVO1BklRQhSv6p0w&autoplay=1",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#991b1b"/>
            <text x="50" y="66" font-family="sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">C5N</text>
          </svg>
        `
      },
      {
        id: "eltrece",
        name: "El Trece",
        subtitle: "Canal 13",
        themeClass: "card-eltrece",
        hlsUrl: "https://livetrx01.vodgc.net/eltrecetv/index.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="#581c87"/>
            <circle cx="50" cy="50" r="28" fill="#ea580c"/>
            <circle cx="50" cy="50" r="15" fill="#facc15"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">el trece</text>
          </svg>
        `
      },
      {
        id: "tvpublica",
        name: "TV Pública",
        subtitle: "Canal 7",
        themeClass: "card-tvpublica",
        hlsUrl: "https://live-01-01-tvp.vodgc.net/tvp/live/playlist.m3u8",
        ytUrl: "https://www.youtube-nocookie.com/embed/live_stream?channel=UCfaI8y6eG_vF0q5Q67a-vHQ&autoplay=1",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0369a1"/>
            <rect x="0" y="35" width="100" height="30" fill="#ffffff"/>
            <circle cx="50" cy="50" r="11" fill="#f59e0b"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">TV PÚBLICA</text>
          </svg>
        `
      },
      {
        id: "canalrural",
        name: "Canal Rural",
        subtitle: "El campo en vivo",
        themeClass: "card-canalrural",
        hlsUrl: "http://181.209.91.106:2222/Live/46055fc7d4bd0b1e3c91e9a9f1581864/rural.playlist.m3u8",
        fallbackHls: "https://elrural.com/envivo",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#14532d"/>
            <path d="M50 20 C65 35 65 65 50 80 C35 65 35 35 50 20 Z" fill="#84cc16"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">RURAL</text>
          </svg>
        `
      }
    ];

    /* ==========================================================================
       GESTIÓN DE ACCESIBILIDAD Y FILTRO DE TEMBLOR (DEBOUNCE / REBOUND FILTER)
       ========================================================================== */
    let lastTapTimestamp = 0;
    const TREMOR_DEBOUNCE_MS = 650; // Ignora toques múltiples involuntarios en menos de 650ms
    let touchStartX = 0;
    let touchStartY = 0;

    function isValidIntentionalTap(event) {
      const now = Date.now();
      if (now - lastTapTimestamp < TREMOR_DEBOUNCE_MS) {
        return false; // Descartado por rebote de temblor
      }
      lastTapTimestamp = now;
      
      // Vibración de confirmación si el hardware lo soporta (feedback táctil)
      if (navigator.vibrate) {
        navigator.vibrate(60);
      }
      return true;
    }

    /* ==========================================================================
       RENDERIZADO DE LA GRILLA DE CANALES
       ========================================================================== */
    const container = document.getElementById("channels-container");
    CHANNELS.forEach((channel, index) => {
      const card = document.createElement("div");
      card.className = `channel-card ${channel.themeClass}`;
      card.innerHTML = `
        <div class="logo-container">${channel.logoSvg}</div>
        <div class="channel-title">${channel.name}</div>
        <div class="channel-subtitle">${channel.subtitle}</div>
      `;

      // Eventos táctiles optimizados para temblor
      card.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        card.classList.add("is-pressed");
      }, { passive: true });

      card.addEventListener("touchend", (e) => {
        card.classList.remove("is-pressed");
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        
        // Tolerancia a movimiento involuntario (si se movió menos de 30px, es un toque válido)
        const moveDist = Math.hypot(touchEndX - touchStartX, touchEndY - touchStartY);
        if (moveDist < 30) {
          if (isValidIntentionalTap(e)) {
            openChannel(index);
          }
        }
      });

      card.addEventListener("click", (e) => {
        // Soporte mouse / emulador
        if (isValidIntentionalTap(e)) {
          openChannel(index);
        }
      });

      container.appendChild(card);
    });

    /* ==========================================================================
       CONTROL DEL REPRODUCTOR
       ========================================================================== */
    let currentIndex = 0;
    let hlsInstance = null;
    let overlayTimeout = null;

    const viewHome = document.getElementById("view-home");
    const viewPlayer = document.getElementById("view-player");
    const video = document.getElementById("tv-video");
    const iframeWrapper = document.getElementById("iframe-wrapper");
    const playerLoading = document.getElementById("player-loading");
    const loadingText = document.getElementById("loading-text");
    const playerOverlay = document.getElementById("player-overlay");
    const playerChannelName = document.getElementById("player-channel-name");

    const btnBack = document.getElementById("btn-back");
    const btnPrev = document.getElementById("btn-prev-channel");
    const btnNext = document.getElementById("btn-next-channel");
    const btnReload = document.getElementById("btn-reload-stream");

    function showLoading(text = "Conectando señal...") {
      loadingText.textContent = text;
      playerLoading.style.display = "flex";
    }

    function hideLoading() {
      playerLoading.style.display = "none";
    }

    function resetOverlayTimer() {
      playerOverlay.classList.remove("hidden");
      clearTimeout(overlayTimeout);
      // Los controles permanecen visibles 5 segundos y luego se ocultan para no molestar la visión
      overlayTimeout = setTimeout(() => {
        playerOverlay.classList.add("hidden");
      }, 5000);
    }

    // Al tocar en cualquier lado de la pantalla de video, se vuelven a mostrar los controles
    document.getElementById("video-wrapper").addEventListener("click", () => {
      resetOverlayTimer();
    });

    function openChannel(index) {
      currentIndex = index;
      const channel = CHANNELS[currentIndex];

      // Cambiar de vista
      viewHome.style.display = "none";
      viewPlayer.style.display = "flex";
      playerChannelName.textContent = channel.name;
      resetOverlayTimer();

      playCurrentChannel();
    }

    function playCurrentChannel() {
      const channel = CHANNELS[currentIndex];
      showLoading(`Sintonizando ${channel.name}...`);

      // Detener reproducciones anteriores
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.src = "";
      video.style.display = "block";
      iframeWrapper.style.display = "none";
      iframeWrapper.innerHTML = "";

      // Intentar reproducir stream HLS
      if (Hls.isSupported() && channel.hlsUrl) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60
        });

        hlsInstance.loadSource(channel.hlsUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          hideLoading();
          video.play().catch(e => console.log("Autoplay bloqueado:", e));
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.warn("Falla en HLS primario:", data);
            // Si el stream HLS falla y el canal tiene YouTube disponible, conmutar a YouTube
            if (channel.ytUrl) {
              fallbackToYouTube(channel);
            } else if (channel.fallbackHls) {
              hlsInstance.loadSource(channel.fallbackHls);
            } else {
              showLoading("Reconectando señal en vivo...");
              setTimeout(() => hlsInstance.loadSource(channel.hlsUrl), 3000);
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari / iOS nativo
        video.src = channel.hlsUrl;
        video.addEventListener("loadedmetadata", () => {
          hideLoading();
          video.play();
        });
      } else if (channel.ytUrl) {
        fallbackToYouTube(channel);
      }
    }

    function fallbackToYouTube(channel) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.style.display = "none";
      iframeWrapper.style.display = "block";
      iframeWrapper.innerHTML = `
        <iframe 
          src="${channel.ytUrl}" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      `;
      hideLoading();
    }

    function closePlayer() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.src = "";
      iframeWrapper.innerHTML = "";

      viewPlayer.style.display = "none";
      viewHome.style.display = "flex";
      clearTimeout(overlayTimeout);
    }

    // BOTÓN VOLVER GIGANTE
    btnBack.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isValidIntentionalTap(e)) {
        closePlayer();
      }
    });

    // CANAL SIGUIENTE / ANTERIOR
    btnNext.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isValidIntentionalTap(e)) {
        currentIndex = (currentIndex + 1) % CHANNELS.length;
        playerChannelName.textContent = CHANNELS[currentIndex].name;
        playCurrentChannel();
        resetOverlayTimer();
      }
    });

    btnPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isValidIntentionalTap(e)) {
        currentIndex = (currentIndex - 1 + CHANNELS.length) % CHANNELS.length;
        playerChannelName.textContent = CHANNELS[currentIndex].name;
        playCurrentChannel();
        resetOverlayTimer();
      }
    });

    // REINTENTAR SEÑAL
    btnReload.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isValidIntentionalTap(e)) {
        playCurrentChannel();
      }
    });

    // Soporte para botón "Atrás" de Android / tablet
    window.addEventListener("popstate", () => {
      if (viewPlayer.style.display === "flex") {
        closePlayer();
      }
    });

    // Registro de Service Worker para habilitar instalación PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registrado con éxito'))
          .catch(err => console.log('Error registrando Service Worker:', err));
      });
    }
  </script>
</body>
</html>
