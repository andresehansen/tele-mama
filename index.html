<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tele</title>
  
  <!-- Oculta el Referer globalmente para que los servidores HLS (El Trece / vodgc.net) no bloqueen por CORS, mientras que el iframe de YouTube define su propio referrerpolicy="strict-origin-when-cross-origin" -->
  <meta name="referrer" content="no-referrer">

  <!-- Web App Manifest para instalación PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Tele">

  <!-- Hls.js para reproducción directa de streams HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* VISTA DE INICIO (GRILLA 2x3 EN VERTICAL PARA TABLET) */
    #view-home {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header.app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 18px 12px;
    }

    header.app-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-live {
      background: #e11d48;
      color: white;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Grilla de 2 columnas en vertical y 3 en horizontal */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 1fr;
      gap: 16px;
      flex: 1;
    }

    @media (orientation: landscape) {
      .channels-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      header.app-header h1 {
        font-size: 2.6rem;
      }
    }

    /* Tarjetas gigantes en el menú principal */
    .channel-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      padding: 20px;
      cursor: pointer;
      text-align: center;
      border: 4px solid transparent;
      transition: transform 0.12s ease, border-color 0.12s ease, filter 0.12s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      min-height: 145px;
    }

    .channel-card:active, .channel-card.is-pressed {
      transform: scale(0.96);
      border-color: #ffffff;
      filter: brightness(1.2);
    }

    .channel-card .logo-container {
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .channel-card .logo-container svg {
      width: 100%;
      height: 100%;
    }

    .channel-card .channel-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      line-height: 1.1;
    }

    .channel-card .channel-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }

    /* Colores e identidades visuales */
    .card-tn {
      background: linear-gradient(135deg, #0b2545 0%, #134074 60%, #e65c00 100%);
    }
    .card-telefe {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0284c7 100%);
    }
    .card-c5n {
      background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 60%, #dc2626 100%);
    }
    .card-eltrece {
      background: linear-gradient(135deg, #2a0845 0%, #540d6e 50%, #f72585 100%);
    }
    .card-tvpublica {
      background: linear-gradient(135deg, #075985 0%, #0284c7 50%, #38bdf8 100%);
    }
    .card-canalrural {
      background: linear-gradient(135deg, #14532d 0%, #15803d 60%, #84cc16 100%);
    }

    /* VISTA DE REPRODUCTOR (100% NATIVO EN PÁGINA) */
    #view-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 1000;
      flex-direction: column;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video#tv-video, iframe#tv-iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      border: none;
    }

    iframe#tv-iframe {
      pointer-events: none !important;
    }

    /* Cartel de mensaje o reintento */
    .channel-notice-card {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      max-width: 650px;
      background: rgba(15, 23, 42, 0.95);
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 32px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.85);
      z-index: 50;
    }

    .channel-notice-card h2 {
      font-size: 1.9rem;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .channel-notice-card p {
      font-size: 1.25rem;
      color: #cbd5e1;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* CAPA DE CONTROLES (SOBRE EL VIDEO, SIN BLOQUEOS NI INTERFERENCIAS) */
    .player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.92) 100%);
      z-index: 100;
    }

    .player-overlay.hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 110;
    }

    /* BOTÓN VOLVER GIGANTE (Esquina superior izquierda, alejado del temblor derecho) */
    .btn-giant {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 1.6rem;
      font-weight: 800;
      padding: 16px 32px;
      border-radius: 9999px;
      background: #facc15;
      color: #000000;
      border: 4px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      min-height: 76px;
    }

    .btn-giant:active {
      transform: scale(0.95);
      background: #eab308;
    }

    .current-channel-info {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 24px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.25);
    }

    .current-channel-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
    }

    /* MENÚ DIRECTO DE 6 CANALES EN PANTALLA */
    .overlay-bottom {
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      z-index: 110;
    }

    .channel-menu-label {
      font-size: 1.15rem;
      font-weight: 800;
      color: rgba(255,255,255,0.9);
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .channel-selector-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      width: 100%;
    }

    @media (orientation: portrait) {
      .channel-selector-bar {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
    }

    .btn-channel-select {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-radius: 18px;
      min-height: 68px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: transform 0.1s ease, border-color 0.1s ease;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .btn-channel-select:active {
      transform: scale(0.95);
    }

    .btn-channel-select.active {
      border: 4px solid #facc15 !important;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.85);
      filter: brightness(1.2);
    }

    /* Spinner de carga */
    .loading-spinner {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
      background: rgba(0,0,0,0.85);
      padding: 24px 36px;
      border-radius: 24px;
      border: 2px solid rgba(255,255,255,0.2);
      z-index: 60;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ==================== VISTA PRINCIPAL: GRILLA DE CANALES ==================== -->
  <main id="view-home">
    <header class="app-header">
      <h1>
        📺 Mi Tele
        <span class="badge-live">En Vivo</span>
      </h1>
      <span style="font-size: 1.15rem; color: #94a3b8; font-weight: 700;">Tocá el canal que quieras ver</span>
    </header>

    <section class="channels-grid" id="channels-container">
      <!-- Generado dinámicamente -->
    </section>
  </main>

  <!-- ==================== VISTA DE REPRODUCTOR (100% EN PÁGINA) ==================== -->
  <section id="view-player">
    <div class="video-container" id="video-wrapper">
      
      <!-- Video HLS Nativo -->
      <video id="tv-video" playsinline webkit-playsinline></video>

      <!-- Iframe protegido con escudo táctil (pointer-events: none) para canales en vivo -->
      <iframe id="tv-iframe" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen playsinline style="display: none;"></iframe>

      <!-- Cartel de carga -->
      <div class="loading-spinner" id="player-loading">
        <div class="spinner"></div>
        <span id="loading-text">Conectando canal...</span>
      </div>

      <!-- Tarjeta de aviso si una señal tiene restricción externa de emisión -->
      <div class="channel-notice-card" id="channel-notice">
        <h2 id="notice-title">Señal no disponible en web</h2>
        <p id="notice-desc">Esta señal requiere sintonización directa.</p>
        <button class="btn-giant" id="btn-notice-retry" style="font-size: 1.3rem; min-height: 60px;">
          🔄 Reintentar conexión
        </button>
      </div>

      <!-- Capa de controles sobreimpresos -->
      <div class="player-overlay" id="player-overlay">
        <!-- Parte Superior: Botón Volver gigante en esquina izquierda -->
        <div class="overlay-top">
          <button class="btn-giant" id="btn-back">
            ⬅ VOLVER
          </button>
          
          <div class="current-channel-info">
            <span class="badge-live">VIVO</span>
            <span class="current-channel-name" id="player-channel-name">Canal</span>
          </div>
        </div>

        <!-- Parte Inferior: Menú Directo de los 6 Canales en Pantalla -->
        <div class="overlay-bottom">
          <span class="channel-menu-label">Tocá para cambiar de canal:</span>
          <div class="channel-selector-bar" id="channel-selector-bar">
            <!-- 6 botones directos generados automáticamente -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    /* ==========================================================================
       CONFIGURACIÓN DE PROXY CORS (CLOUDFLARE WORKER)
       ========================================================================== */
    // Una vez desplegado tu Worker gratuito en Cloudflare, pegá su URL aquí:
    const CLOUDFLARE_WORKER_URL = "https://mi-tele-proxy.andresehansen.workers.dev";

    function getProxiedUrl(targetUrl) {
      if (!CLOUDFLARE_WORKER_URL || !targetUrl) return targetUrl;
      const base = CLOUDFLARE_WORKER_URL.endsWith("/")
        ? CLOUDFLARE_WORKER_URL.slice(0, -1)
        : CLOUDFLARE_WORKER_URL;
      return `${base}/?url=${encodeURIComponent(targetUrl)}`;
    }

    function buildYtEmbedUrl(videoId) {
      return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&playsinline=1`;
    }

    /* ==========================================================================
       CONFIGURACIÓN DE LOS 6 CANALES VERIFICADOS EN VIVO
       ========================================================================== */
    const CHANNELS = [
      {
        id: "tn",
        name: "TN",
        subtitle: "Todo Noticias",
        themeClass: "card-tn",
        type: "youtube-live",
        ytVideoId: "cb12KmMMDJA",
        ytLivePageUrl: "https://www.youtube.com/@todonoticias/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0b2545"/>
            <path d="M15 15 L85 15 L60 85 L15 85 Z" fill="#e65c00" opacity="0.3"/>
            <text x="50" y="65" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">TN</text>
          </svg>
        `
      },
      {
        id: "telefe",
        name: "Telefe",
        subtitle: "Canal 11",
        themeClass: "card-telefe",
        type: "telefe-token",
        tokenApiUrl: "https://57j4mtvcjjf7siqnnvkixb5d3i0uvjei.lambda-url.us-east-1.on.aws/?stream_id=6a024684fd4ca6a938f3a118",
        streamId: "6a024684fd4ca6a938f3a118",
        useProxy: true,
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="28" cy="50" r="18" fill="#2563eb" />
            <circle cx="50" cy="50" r="18" fill="#16a34a" />
            <circle cx="72" cy="50" r="18" fill="#dc2626" />
            <text x="50" y="86" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">telefe</text>
          </svg>
        `
      },
      {
        id: "c5n",
        name: "C5N",
        subtitle: "Noticias 24hs",
        themeClass: "card-c5n",
        type: "youtube-live",
        ytVideoId: "rZtTUCxpPuI",
        ytLivePageUrl: "https://www.youtube.com/@c5n/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#991b1b"/>
            <text x="50" y="66" font-family="sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">C5N</text>
          </svg>
        `
      },
      {
        id: "eltrece",
        name: "El Trece",
        subtitle: "Canal 13",
        themeClass: "card-eltrece",
        type: "hls",
        useProxy: false, // 100% nativo Full HD 1080p confirmado funcionando
        hlsUrl: "https://livetrx01.vodgc.net/eltrecetv/index.m3u8",
        fallbackHls: "https://live-01-01-eltrece.vodgc.net/eltrecetv/index.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="#581c87"/>
            <circle cx="50" cy="50" r="28" fill="#ea580c"/>
            <circle cx="50" cy="50" r="15" fill="#facc15"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">el trece</text>
          </svg>
        `
      },
      {
        id: "tvpublica",
        name: "TV Pública",
        subtitle: "Canal 7",
        themeClass: "card-tvpublica",
        type: "youtube-live",
        ytVideoId: "YNApZJdaqfg",
        ytLivePageUrl: "https://www.youtube.com/channel/UCs231K71Bnu5295_x0MB5Pg/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0369a1"/>
            <rect x="0" y="35" width="100" height="30" fill="#ffffff"/>
            <circle cx="50" cy="50" r="11" fill="#f59e0b"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">TV PÚBLICA</text>
          </svg>
        `
      },
      {
        id: "canalrural",
        name: "Canal Rural",
        subtitle: "El campo en vivo",
        themeClass: "card-canalrural",
        type: "youtube-live",
        ytVideoId: "w78Zr0J-dIs",
        ytLivePageUrl: "https://www.youtube.com/@canalrural/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#14532d"/>
            <path d="M50 20 C65 35 65 65 50 80 C35 65 35 35 50 20 Z" fill="#84cc16"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">RURAL</text>
          </svg>
        `
      }
    ];

    /* ==========================================================================
       FILTRO DE TEMBLOR ESENCIAL (DEBOUNCE 650ms + TOLERANCIA A ARRASTRE)
       ========================================================================== */
    let lastTapTime = 0;
    const TREMOR_DEBOUNCE_MS = 650;
    let touchStartX = 0;
    let touchStartY = 0;

    function isIntentionalTap(event) {
      const now = Date.now();
      if (now - lastTapTime < TREMOR_DEBOUNCE_MS) {
        return false;
      }
      lastTapTime = now;
      if (navigator.vibrate) {
        navigator.vibrate(60);
      }
      return true;
    }

    /* ==========================================================================
       CONSTRUCCIÓN DE LA GRILLA PRINCIPAL
       ========================================================================== */
    const container = document.getElementById("channels-container");
    CHANNELS.forEach((channel, index) => {
      const card = document.createElement("div");
      card.className = `channel-card ${channel.themeClass}`;
      card.innerHTML = `
        <div class="logo-container">${channel.logoSvg}</div>
        <div class="channel-title">${channel.name}</div>
        <div class="channel-subtitle">${channel.subtitle}</div>
      `;

      card.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        card.classList.add("is-pressed");
      }, { passive: true });

      card.addEventListener("touchend", (e) => {
        card.classList.remove("is-pressed");
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const dist = Math.hypot(touchEndX - touchStartX, touchEndY - touchStartY);
        if (dist < 35 && isIntentionalTap(e)) {
          openChannel(index);
        }
      });

      card.addEventListener("click", (e) => {
        if (isIntentionalTap(e)) {
          openChannel(index);
        }
      });

      container.appendChild(card);
    });

    /* ==========================================================================
       CONSTRUCCIÓN DEL MENÚ INFERIOR DIRECTO DE CANALES
       ========================================================================== */
    const channelBar = document.getElementById("channel-selector-bar");
    CHANNELS.forEach((channel, index) => {
      const btn = document.createElement("button");
      btn.className = `btn-channel-select ${channel.themeClass}`;
      btn.id = `btn-bar-${channel.id}`;
      btn.textContent = channel.name;

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (isIntentionalTap(e)) {
          openChannel(index);
          resetOverlayTimer();
        }
      });

      channelBar.appendChild(btn);
    });

    /* ==========================================================================
       LÓGICA DEL REPRODUCTOR
       ========================================================================== */
    let currentIndex = 0;
    let hlsInstance = null;
    let overlayTimeout = null;
    let hasTriedFallback = false;

    const viewHome = document.getElementById("view-home");
    const viewPlayer = document.getElementById("view-player");
    const video = document.getElementById("tv-video");
    const playerLoading = document.getElementById("player-loading");
    const loadingText = document.getElementById("loading-text");
    const channelNotice = document.getElementById("channel-notice");
    const noticeTitle = document.getElementById("notice-title");
    const noticeDesc = document.getElementById("notice-desc");
    const btnNoticeRetry = document.getElementById("btn-notice-retry");
    const playerOverlay = document.getElementById("player-overlay");
    const playerChannelName = document.getElementById("player-channel-name");
    const btnBack = document.getElementById("btn-back");

    function showLoading(text) {
      loadingText.textContent = text;
      playerLoading.style.display = "flex";
      channelNotice.style.display = "none";
    }

    function hideLoading() {
      playerLoading.style.display = "none";
    }

    function resetOverlayTimer() {
      playerOverlay.classList.remove("hidden");
      clearTimeout(overlayTimeout);
      // Mantiene los controles 6 segundos y luego los oculta para ver TV limpia
      overlayTimeout = setTimeout(() => {
        playerOverlay.classList.add("hidden");
      }, 6000);
    }

    // Tocar cualquier parte de la pantalla siempre muestra u oculta el menú web
    document.getElementById("video-wrapper").addEventListener("click", (e) => {
      if (playerOverlay.classList.contains("hidden")) {
        resetOverlayTimer();
      } else {
        playerOverlay.classList.add("hidden");
      }
    });

    function updateActiveButtonInBar() {
      CHANNELS.forEach((ch, idx) => {
        const btn = document.getElementById(`btn-bar-${ch.id}`);
        if (btn) {
          if (idx === currentIndex) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        }
      });
    }

    function openChannel(index) {
      currentIndex = index;
      const channel = CHANNELS[currentIndex];

      viewHome.style.display = "none";
      viewPlayer.style.display = "flex";
      playerChannelName.textContent = channel.name;
      updateActiveButtonInBar();
      resetOverlayTimer();

      playCurrentChannel();
    }

    function startHlsStream(channel, rawHlsUrl, forceProxy) {
      video.style.display = "block";
      const shouldUseProxy = (forceProxy || channel.useProxy) && !!CLOUDFLARE_WORKER_URL;
      const initialUrl = shouldUseProxy ? getProxiedUrl(rawHlsUrl) : rawHlsUrl;

      if (Hls.isSupported() && rawHlsUrl) {
        const hlsConfig = {
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          manifestLoadingTimeOut: 12000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 12000,
          fragLoadingTimeOut: 15000
        };

        if (shouldUseProxy) {
          class CorsProxyLoader extends Hls.DefaultConfig.loader {
            load(context, config, callbacks) {
              if (context.url && !context.url.includes(CLOUDFLARE_WORKER_URL)) {
                context.url = getProxiedUrl(context.url);
              }
              super.load(context, config, callbacks);
            }
          }
          hlsConfig.loader = CorsProxyLoader;
        }

        hlsInstance = new Hls(hlsConfig);
        hlsInstance.loadSource(initialUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          hideLoading();
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch((err) => {
              console.log("Autoplay con audio bloqueado por navegador, intentando muted:", err);
              video.muted = true;
              video.play().catch(e => console.log("Play error:", e));
            });
          }
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.warn(`Error HLS fatal en ${channel.name}:`, data);
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                if (!hasTriedFallback && channel.fallbackHls && channel.fallbackHls !== rawHlsUrl) {
                  hasTriedFallback = true;
                  console.log(`Probando stream de respaldo para ${channel.name}...`);
                  showLoading(`Conectando señal de respaldo...`);
                  const fallbackUrl = shouldUseProxy ? getProxiedUrl(channel.fallbackHls) : channel.fallbackHls;
                  hlsInstance.loadSource(fallbackUrl);
                  hlsInstance.startLoad();
                } else {
                  hideLoading();
                  showChannelNotice(
                    `Señal de ${channel.name} no disponible`,
                    `El servidor de la emisora no responde en este momento. Podés reintentar o elegir otro canal abajo.`
                  );
                }
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn("Recuperando de error de medios...");
                hlsInstance.recoverMediaError();
                break;
              default:
                hideLoading();
                showChannelNotice(
                  `Error en la transmisión de ${channel.name}`,
                  `Hubo un inconveniente al cargar el video. Tocá "Reintentar" o elegí otro canal.`
                );
                if (hlsInstance) {
                  hlsInstance.destroy();
                }
                break;
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = initialUrl;
        video.addEventListener("loadedmetadata", () => {
          hideLoading();
          video.play().catch(e => {
            video.muted = true;
            video.play();
          });
        });
        video.addEventListener("error", () => {
          if (!hasTriedFallback && channel.fallbackHls) {
            hasTriedFallback = true;
            video.src = shouldUseProxy ? getProxiedUrl(channel.fallbackHls) : channel.fallbackHls;
          } else {
            hideLoading();
            showChannelNotice(`Señal de ${channel.name} no disponible`, `No se pudo reproducir en este navegador.`);
          }
        });
      } else {
        hideLoading();
        showChannelNotice("Navegador no compatible", "Tu navegador no soporta streaming HLS.");
      }
    }

    async function playCurrentChannel() {
      const activeIdx = currentIndex;
      const channel = CHANNELS[activeIdx];
      hasTriedFallback = false;
      showLoading(`Sintonizando ${channel.name}...`);
      channelNotice.style.display = "none";

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.style.display = "none";

      const iframe = document.getElementById("tv-iframe");
      iframe.src = "";
      iframe.style.display = "none";

      if (channel.type === "youtube-live") {
        // MODO YOUTUBE EN VIVO CON AUTO-ACTUALIZACIÓN DE VIDEO_ID VÍA WORKER
        iframe.style.display = "block";
        iframe.src = buildYtEmbedUrl(channel.ytVideoId);
        setTimeout(() => {
          if (currentIndex === activeIdx) hideLoading();
        }, 1200);

        // Verificar en segundo plano si el canal rotó su ID de vivo en YouTube
        if (channel.ytLivePageUrl && CLOUDFLARE_WORKER_URL) {
          try {
            const resp = await fetch(getProxiedUrl(channel.ytLivePageUrl));
            if (resp.ok) {
              const html = await resp.text();
              const match = html.match(/<link rel="canonical" href="https:\/\/www\.youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})"/);
              if (match && match[1] && match[1] !== channel.ytVideoId) {
                console.log(`[Auto-Heal] Nuevo videoId detectado para ${channel.name}: ${match[1]}`);
                channel.ytVideoId = match[1];
                if (currentIndex === activeIdx) {
                  iframe.src = buildYtEmbedUrl(channel.ytVideoId);
                }
              }
            }
          } catch (e) {
            console.log(`Verificación en segundo plano de ${channel.name} omitida:`, e);
          }
        }
      } else if (channel.type === "embed") {
        // MODO REPRODUCTOR OFICIAL EMBEBIDO BLINDADO (TV Pública Vink Magma)
        iframe.style.display = "block";
        iframe.src = channel.embedUrl;
        setTimeout(() => {
          if (currentIndex === activeIdx) hideLoading();
        }, 1200);
      } else if (channel.type === "telefe-token") {
        // MODO TELEFE EN VIVO OFICIAL (Resolución dinámica de access_token en Mediastream)
        try {
          const tokenUrl = CLOUDFLARE_WORKER_URL
            ? getProxiedUrl(channel.tokenApiUrl)
            : channel.tokenApiUrl;
          const resp = await fetch(tokenUrl);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          if (currentIndex !== activeIdx) return;

          if (data && data.access_token) {
            const m3u8Url = `https://mdstrm.com/live-stream-playlist/${channel.streamId}.m3u8?access_token=${data.access_token}`;
            startHlsStream(channel, m3u8Url, true);
          } else {
            throw new Error("Token no encontrado");
          }
        } catch (err) {
          console.warn("Error al obtener token de Telefe:", err);
          if (currentIndex === activeIdx) {
            hideLoading();
            showChannelNotice(
              `Señal de ${channel.name} no disponible`,
              `Recordá actualizar el código de worker.js en Cloudflare para habilitar el acceso a Telefe.`
            );
          }
        }
      } else {
        // MODO HLS NATIVO DIRECTO (El Trece Full HD 1080p)
        startHlsStream(channel, channel.hlsUrl, false);
      }
    }

    function showChannelNotice(title, desc) {
      noticeTitle.textContent = title;
      noticeDesc.textContent = desc;
      channelNotice.style.display = "flex";
    }

    btnNoticeRetry.addEventListener("click", (e) => {
      e.stopPropagation();
      playCurrentChannel();
    });

    function closePlayer() {
      clearTimeout(overlayTimeout);

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.style.display = "none";

      const iframe = document.getElementById("tv-iframe");
      iframe.src = "";
      iframe.style.display = "none";

      viewPlayer.style.display = "none";
      viewHome.style.display = "flex";
    }

    // BOTÓN VOLVER GIGANTE
    btnBack.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isIntentionalTap(e)) {
        closePlayer();
      }
    });

    window.addEventListener("popstate", () => {
      if (viewPlayer.style.display === "flex") {
        closePlayer();
      }
    });

    // Registro de Service Worker para PWA con actualización inmediata
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=9')
          .then(reg => {
            console.log('PWA Service Worker registrado con éxito');
            reg.update();
          })
          .catch(err => console.log('Error de Service Worker:', err));
      });
    }
  </script>
</body>
</html>
