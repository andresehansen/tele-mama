<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tele</title>
  
  <!-- Web App Manifest para instalación PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Tele">

  <!-- Hls.js para reproducción de streams seguros HTTPS .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* VISTA DE CANALES (GRILLA VERTICAL PARA TABLET) */
    #view-home {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header.app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 18px 12px;
    }

    header.app-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-live {
      background: #e11d48;
      color: white;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Grilla de 2 columnas en vertical (estilo WhatsApp) */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 1fr;
      gap: 16px;
      flex: 1;
    }

    /* En horizontal: 3 columnas */
    @media (orientation: landscape) {
      .channels-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      header.app-header h1 {
        font-size: 2.6rem;
      }
    }

    /* Tarjetas gigantes de canal (Mínimo 140px alto para evitar errores con temblor) */
    .channel-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      padding: 20px;
      cursor: pointer;
      text-align: center;
      border: 4px solid transparent;
      transition: transform 0.12s ease, border-color 0.12s ease, filter 0.12s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      min-height: 145px;
    }

    .channel-card:active, .channel-card.is-pressed {
      transform: scale(0.96);
      border-color: #ffffff;
      filter: brightness(1.2);
    }

    .channel-card .logo-container {
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .channel-card .logo-container svg {
      width: 100%;
      height: 100%;
    }

    .channel-card .channel-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      line-height: 1.1;
    }

    .channel-card .channel-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }

    .badge-yt-hint {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fca5a5;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    /* Colores e identidades visuales */
    .card-tn {
      background: linear-gradient(135deg, #0b2545 0%, #134074 60%, #e65c00 100%);
    }
    .card-telefe {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0284c7 100%);
    }
    .card-c5n {
      background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 60%, #dc2626 100%);
    }
    .card-eltrece {
      background: linear-gradient(135deg, #2a0845 0%, #540d6e 50%, #f72585 100%);
    }
    .card-tvpublica {
      background: linear-gradient(135deg, #075985 0%, #0284c7 50%, #38bdf8 100%);
    }
    .card-canalrural {
      background: linear-gradient(135deg, #14532d 0%, #15803d 60%, #84cc16 100%);
    }

    /* VISTA DE REPRODUCCIÓN (PLAYER) */
    #view-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 1000;
      flex-direction: column;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Pantalla de Contingencia / Fallback cuando se abre en YouTube */
    .fallback-box {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      max-width: 650px;
      background: rgba(15, 23, 42, 0.95);
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
      z-index: 20;
    }

    .fallback-box h2 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .fallback-box p {
      font-size: 1.3rem;
      color: #cbd5e1;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* BOTÓN GIGANTE AMARILLO (Ergonómico para temblor) */
    .btn-giant {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 1.7rem;
      font-weight: 800;
      padding: 18px 36px;
      border-radius: 9999px;
      background: #facc15;
      color: #000000;
      border: 4px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      min-height: 80px;
      text-decoration: none;
    }

    .btn-giant:active {
      transform: scale(0.95);
      background: #eab308;
    }

    .btn-giant-red {
      background: #dc2626;
      color: #ffffff;
      border-color: #fecaca;
    }
    .btn-giant-red:active {
      background: #b91c1c;
    }

    /* Capa de controles sobre el video */
    .player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.85) 100%);
    }

    .player-overlay.hidden {
      opacity: 0;
    }

    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }

    .current-channel-info {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .current-channel-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
    }

    .overlay-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: auto;
    }

    .btn-nav-channel {
      flex: 1;
      max-width: 250px;
      min-height: 72px;
      font-size: 1.35rem;
      font-weight: 700;
      border-radius: 20px;
      background: rgba(30, 41, 59, 0.9);
      color: #ffffff;
      border: 3px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-nav-channel:active {
      background: #334155;
      transform: scale(0.96);
    }

    /* Spinner de carga */
    .loading-spinner {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
      background: rgba(0,0,0,0.75);
      padding: 24px 36px;
      border-radius: 24px;
      border: 2px solid rgba(255,255,255,0.2);
      z-index: 10;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ==================== VISTA PRINCIPAL: GRILLA DE CANALES ==================== -->
  <main id="view-home">
    <header class="app-header">
      <h1>
        📺 Mi Tele
        <span class="badge-live">En Vivo</span>
      </h1>
      <span style="font-size: 1.15rem; color: #94a3b8; font-weight: 700;">Tocá el canal que quieras ver</span>
    </header>

    <section class="channels-grid" id="channels-container">
      <!-- Generado dinámicamente -->
    </section>
  </main>

  <!-- ==================== VISTA DE REPRODUCTOR ==================== -->
  <section id="view-player">
    <div class="video-container" id="video-wrapper">
      <video id="tv-video" playsinline webkit-playsinline></video>

      <!-- Mensaje de Carga -->
      <div class="loading-spinner" id="player-loading">
        <div class="spinner"></div>
        <span id="loading-text">Conectando canal en vivo...</span>
      </div>

      <!-- Cuadro de Contingencia para ver en YouTube -->
      <div class="fallback-box" id="fallback-box">
        <h2 id="fallback-title">Ver transmisión en vivo</h2>
        <p id="fallback-desc">Este canal transmite de forma oficial a través de YouTube.</p>
        <a href="#" target="_blank" class="btn-giant btn-giant-red" id="btn-open-youtube">
          ▶ ABRIR EN YOUTUBE
        </a>
      </div>

      <!-- Controles sobreimpresos gigantes -->
      <div class="player-overlay" id="player-overlay">
        <!-- Parte Superior: Botón Volver gigante en esquina superior izquierda -->
        <div class="overlay-top">
          <button class="btn-giant" id="btn-back">
            ⬅ VOLVER
          </button>
          
          <div class="current-channel-info">
            <span class="badge-live">VIVO</span>
            <span class="current-channel-name" id="player-channel-name">Canal</span>
          </div>
        </div>

        <!-- Parte Inferior: Navegación de canales -->
        <div class="overlay-bottom">
          <button class="btn-nav-channel" id="btn-prev-channel">
            ⏮ Anterior
          </button>
          
          <button class="btn-giant" id="btn-force-yt" style="background: rgba(220, 38, 38, 0.85); color: #fff; font-size: 1.15rem; min-height: 60px; min-width: 170px; border-color: rgba(255,255,255,0.4);">
            ▶ Ver en YouTube
          </button>

          <button class="btn-nav-channel" id="btn-next-channel">
            Siguiente ⏭
          </button>
        </div>
      </div>
    </div>
  </section>

  <script>
    /* ==========================================================================
       CONFIGURACIÓN DE LOS 6 CANALES
       Streams HTTPS puros para evitar Mixed Content + Enlaces directos a YouTube
       ========================================================================== */
    const CHANNELS = [
      {
        id: "tn",
        name: "TN",
        subtitle: "Todo Noticias",
        themeClass: "card-tn",
        // Enlace HLS HTTPS directo en vodgc
        hlsUrl: "https://live-01-01-tn.vodgc.net/TN24/index.m3u8",
        fallbackHls: "https://live-01-01-tn.vodgc.net/TN_DAI_Beta/index.m3u8",
        // Transmisión oficial en vivo 24hs en YouTube
        ytLiveUrl: "https://www.youtube.com/@todonoticias/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0b2545"/>
            <path d="M15 15 L85 15 L60 85 L15 85 Z" fill="#e65c00" opacity="0.3"/>
            <text x="50" y="65" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">TN</text>
          </svg>
        `
      },
      {
        id: "telefe",
        name: "Telefe",
        subtitle: "Canal 11",
        themeClass: "card-telefe",
        // Stream oficial HTTPS Pluto TV LATAM
        hlsUrl: "https://siloh-mcdn.plutotv.net/lilo/production/LATAM/Telefe/master.m3u8",
        ytLiveUrl: "https://www.youtube.com/@telefenoticias/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="28" cy="50" r="18" fill="#2563eb" />
            <circle cx="50" cy="50" r="18" fill="#16a34a" />
            <circle cx="72" cy="50" r="18" fill="#dc2626" />
            <text x="50" y="86" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">telefe</text>
          </svg>
        `
      },
      {
        id: "c5n",
        name: "C5N",
        subtitle: "Noticias 24hs",
        themeClass: "card-c5n",
        // Este funciona perfecto confirmado por el usuario
        hlsUrl: "https://c5n-live.vodgc.net/c5n/live/playlist.m3u8",
        ytLiveUrl: "https://www.youtube.com/@c5n/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#991b1b"/>
            <text x="50" y="66" font-family="sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">C5N</text>
          </svg>
        `
      },
      {
        id: "eltrece",
        name: "El Trece",
        subtitle: "Canal 13",
        themeClass: "card-eltrece",
        hlsUrl: "https://live-01-02-eltrece.vodgc.net/eltrecetv/index.m3u8",
        fallbackHls: "https://livetrx01.vodgc.net/eltrecetv/index.m3u8",
        ytLiveUrl: "https://www.youtube.com/@eltrece/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="#581c87"/>
            <circle cx="50" cy="50" r="28" fill="#ea580c"/>
            <circle cx="50" cy="50" r="15" fill="#facc15"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">el trece</text>
          </svg>
        `
      },
      {
        id: "tvpublica",
        name: "TV Pública",
        subtitle: "Canal 7",
        themeClass: "card-tvpublica",
        // Stream oficial HTTPS seguro de CDN Footprint
        hlsUrl: "https://cntlnk-main-edge-access.secure.footprint.net/entrypoint/c7_vivo01_dai_source-20001_all.m3u8",
        ytLiveUrl: "https://www.youtube.com/@TVPublicaArgentina/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0369a1"/>
            <rect x="0" y="35" width="100" height="30" fill="#ffffff"/>
            <circle cx="50" cy="50" r="11" fill="#f59e0b"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">TV PÚBLICA</text>
          </svg>
        `
      },
      {
        id: "canalrural",
        name: "Canal Rural",
        subtitle: "El campo en vivo",
        themeClass: "card-canalrural",
        // Transmisión directa oficial de YouTube para Canal Rural
        directYouTubeOnly: true,
        ytLiveUrl: "https://www.youtube.com/@canalrural/live",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#14532d"/>
            <path d="M50 20 C65 35 65 65 50 80 C35 65 35 35 50 20 Z" fill="#84cc16"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">RURAL</text>
          </svg>
        `
      }
    ];

    /* ==========================================================================
       FILTRO DE TEMBLOR ESENCIAL (DEBOUNCE + TOLERANCIA A ARRASTRE)
       ========================================================================== */
    let lastTapTime = 0;
    const TREMOR_DEBOUNCE_MS = 650;
    let touchStartX = 0;
    let touchStartY = 0;

    function isIntentionalTap(event) {
      const now = Date.now();
      if (now - lastTapTime < TREMOR_DEBOUNCE_MS) {
        return false;
      }
      lastTapTime = now;
      if (navigator.vibrate) {
        navigator.vibrate(60);
      }
      return true;
    }

    /* ==========================================================================
       CONSTRUCCIÓN DE LA GRILLA
       ========================================================================== */
    const container = document.getElementById("channels-container");
    CHANNELS.forEach((channel, index) => {
      const card = document.createElement("div");
      card.className = `channel-card ${channel.themeClass}`;
      
      const ytHint = channel.directYouTubeOnly 
        ? `<span class="badge-yt-hint">🔴 YouTube</span>` 
        : ``;

      card.innerHTML = `
        ${ytHint}
        <div class="logo-container">${channel.logoSvg}</div>
        <div class="channel-title">${channel.name}</div>
        <div class="channel-subtitle">${channel.subtitle}</div>
      `;

      card.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        card.classList.add("is-pressed");
      }, { passive: true });

      card.addEventListener("touchend", (e) => {
        card.classList.remove("is-pressed");
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const dist = Math.hypot(touchEndX - touchStartX, touchEndY - touchStartY);
        if (dist < 35 && isIntentionalTap(e)) {
          openChannel(index);
        }
      });

      card.addEventListener("click", (e) => {
        if (isIntentionalTap(e)) {
          openChannel(index);
        }
      });

      container.appendChild(card);
    });

    /* ==========================================================================
       LÓGICA DEL REPRODUCTOR
       ========================================================================== */
    let currentIndex = 0;
    let hlsInstance = null;
    let overlayTimeout = null;
    let connectionTimeout = null;

    const viewHome = document.getElementById("view-home");
    const viewPlayer = document.getElementById("view-player");
    const video = document.getElementById("tv-video");
    const playerLoading = document.getElementById("player-loading");
    const loadingText = document.getElementById("loading-text");
    const fallbackBox = document.getElementById("fallback-box");
    const fallbackTitle = document.getElementById("fallback-title");
    const fallbackDesc = document.getElementById("fallback-desc");
    const btnOpenYouTube = document.getElementById("btn-open-youtube");
    const playerOverlay = document.getElementById("player-overlay");
    const playerChannelName = document.getElementById("player-channel-name");

    const btnBack = document.getElementById("btn-back");
    const btnPrev = document.getElementById("btn-prev-channel");
    const btnNext = document.getElementById("btn-next-channel");
    const btnForceYT = document.getElementById("btn-force-yt");

    function showLoading(text) {
      loadingText.textContent = text;
      playerLoading.style.display = "flex";
      fallbackBox.style.display = "none";
    }

    function hideLoading() {
      playerLoading.style.display = "none";
    }

    function resetOverlayTimer() {
      playerOverlay.classList.remove("hidden");
      clearTimeout(overlayTimeout);
      overlayTimeout = setTimeout(() => {
        playerOverlay.classList.add("hidden");
      }, 5000);
    }

    document.getElementById("video-wrapper").addEventListener("click", () => {
      resetOverlayTimer();
    });

    function showFallbackYouTube(channel, reason = "") {
      hideLoading();
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.style.display = "none";

      fallbackTitle.textContent = `${channel.name} en Vivo`;
      fallbackDesc.textContent = reason || `Tocá el botón para abrir la transmisión oficial en vivo de ${channel.name} en YouTube.`;
      btnOpenYouTube.href = channel.ytLiveUrl;
      fallbackBox.style.display = "flex";
    }

    function openChannel(index) {
      currentIndex = index;
      const channel = CHANNELS[currentIndex];

      // Si el canal está configurado solo por YouTube (como Canal Rural)
      if (channel.directYouTubeOnly) {
        // En tablets Android, abrir directamente la URL de YouTube abre la app de YouTube oficial
        window.open(channel.ytLiveUrl, "_blank");
        return;
      }

      viewHome.style.display = "none";
      viewPlayer.style.display = "flex";
      playerChannelName.textContent = channel.name;
      btnForceYT.onclick = () => window.open(channel.ytLiveUrl, "_blank");
      resetOverlayTimer();

      playCurrentChannel();
    }

    function playCurrentChannel() {
      const channel = CHANNELS[currentIndex];
      showLoading(`Sintonizando ${channel.name}...`);
      fallbackBox.style.display = "none";
      video.style.display = "block";

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.src = "";

      clearTimeout(connectionTimeout);

      // Si en 5 segundos no conecta el stream HLS por bloqueo de token/CORS, ofrece el botón de YouTube
      connectionTimeout = setTimeout(() => {
        if (video.paused || video.readyState < 2) {
          showFallbackYouTube(channel, `No se pudo conectar la señal directa de ${channel.name}. Podés verla en vivo por YouTube:`);
        }
      }, 5000);

      if (Hls.isSupported() && channel.hlsUrl) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60
        });

        hlsInstance.loadSource(channel.hlsUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          clearTimeout(connectionTimeout);
          hideLoading();
          video.play().catch(e => console.log("Autoplay bloqueado:", e));
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.warn("Falla en HLS:", data);
            if (channel.fallbackHls) {
              hlsInstance.loadSource(channel.fallbackHls);
            } else if (channel.ytLiveUrl) {
              clearTimeout(connectionTimeout);
              showFallbackYouTube(channel);
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = channel.hlsUrl;
        video.addEventListener("loadedmetadata", () => {
          clearTimeout(connectionTimeout);
          hideLoading();
          video.play();
        });
      } else if (channel.ytLiveUrl) {
        clearTimeout(connectionTimeout);
        showFallbackYouTube(channel);
      }
    }

    function closePlayer() {
      clearTimeout(connectionTimeout);
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.src = "";

      viewPlayer.style.display = "none";
      viewHome.style.display = "flex";
      clearTimeout(overlayTimeout);
    }

    // BOTÓN VOLVER GIGANTE
    btnBack.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isIntentionalTap(e)) {
        closePlayer();
      }
    });

    // ANTERIOR / SIGUIENTE
    btnNext.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isIntentionalTap(e)) {
        currentIndex = (currentIndex + 1) % CHANNELS.length;
        openChannel(currentIndex);
      }
    });

    btnPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isIntentionalTap(e)) {
        currentIndex = (currentIndex - 1 + CHANNELS.length) % CHANNELS.length;
        openChannel(currentIndex);
      }
    });

    window.addEventListener("popstate", () => {
      if (viewPlayer.style.display === "flex") {
        closePlayer();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registrado'))
          .catch(err => console.log('Error de Service Worker:', err));
      });
    }
  </script>
</body>
</html>
