<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tele</title>
  
  <!-- Evita enviar 'Referer' a los servidores de video, permitiendo el acceso a streams protegidos -->
  <meta name="referrer" content="no-referrer">

  <!-- Web App Manifest para instalación PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Tele">

  <!-- Hls.js para reproducción directa de streams HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* VISTA DE INICIO (GRILLA 2x3 EN VERTICAL PARA TABLET) */
    #view-home {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header.app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 18px 12px;
    }

    header.app-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-live {
      background: #e11d48;
      color: white;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Grilla de 2 columnas en vertical y 3 en horizontal */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 1fr;
      gap: 16px;
      flex: 1;
    }

    @media (orientation: landscape) {
      .channels-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      header.app-header h1 {
        font-size: 2.6rem;
      }
    }

    /* Tarjetas gigantes en el menú principal */
    .channel-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      padding: 20px;
      cursor: pointer;
      text-align: center;
      border: 4px solid transparent;
      transition: transform 0.12s ease, border-color 0.12s ease, filter 0.12s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      min-height: 145px;
    }

    .channel-card:active, .channel-card.is-pressed {
      transform: scale(0.96);
      border-color: #ffffff;
      filter: brightness(1.2);
    }

    .channel-card .logo-container {
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .channel-card .logo-container svg {
      width: 100%;
      height: 100%;
    }

    .channel-card .channel-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      line-height: 1.1;
    }

    .channel-card .channel-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }

    /* Colores e identidades visuales */
    .card-tn {
      background: linear-gradient(135deg, #0b2545 0%, #134074 60%, #e65c00 100%);
    }
    .card-telefe {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0284c7 100%);
    }
    .card-c5n {
      background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 60%, #dc2626 100%);
    }
    .card-eltrece {
      background: linear-gradient(135deg, #2a0845 0%, #540d6e 50%, #f72585 100%);
    }
    .card-tvpublica {
      background: linear-gradient(135deg, #075985 0%, #0284c7 50%, #38bdf8 100%);
    }
    .card-canalrural {
      background: linear-gradient(135deg, #14532d 0%, #15803d 60%, #84cc16 100%);
    }

    /* VISTA DE REPRODUCTOR (100% NATIVO EN PÁGINA) */
    #view-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 1000;
      flex-direction: column;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video#tv-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Cartel de mensaje o reintento */
    .channel-notice-card {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      max-width: 650px;
      background: rgba(15, 23, 42, 0.95);
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 32px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.85);
      z-index: 50;
    }

    .channel-notice-card h2 {
      font-size: 1.9rem;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .channel-notice-card p {
      font-size: 1.25rem;
      color: #cbd5e1;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* CAPA DE CONTROLES (SOBRE EL VIDEO, SIN BLOQUEOS NI INTERFERENCIAS) */
    .player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.92) 100%);
      z-index: 100;
    }

    .player-overlay.hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 110;
    }

    /* BOTÓN VOLVER GIGANTE (Esquina superior izquierda, alejado del temblor derecho) */
    .btn-giant {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 1.6rem;
      font-weight: 800;
      padding: 16px 32px;
      border-radius: 9999px;
      background: #facc15;
      color: #000000;
      border: 4px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      min-height: 76px;
    }

    .btn-giant:active {
      transform: scale(0.95);
      background: #eab308;
    }

    .current-channel-info {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 24px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.25);
    }

    .current-channel-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
    }

    /* MENÚ DIRECTO DE 6 CANALES EN PANTALLA */
    .overlay-bottom {
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      z-index: 110;
    }

    .channel-menu-label {
      font-size: 1.15rem;
      font-weight: 800;
      color: rgba(255,255,255,0.9);
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .channel-selector-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      width: 100%;
    }

    @media (orientation: portrait) {
      .channel-selector-bar {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
    }

    .btn-channel-select {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-radius: 18px;
      min-height: 68px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: transform 0.1s ease, border-color 0.1s ease;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .btn-channel-select:active {
      transform: scale(0.95);
    }

    .btn-channel-select.active {
      border: 4px solid #facc15 !important;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.85);
      filter: brightness(1.2);
    }

    /* Spinner de carga */
    .loading-spinner {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
      background: rgba(0,0,0,0.85);
      padding: 24px 36px;
      border-radius: 24px;
      border: 2px solid rgba(255,255,255,0.2);
      z-index: 60;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ==================== VISTA PRINCIPAL: GRILLA DE CANALES ==================== -->
  <main id="view-home">
    <header class="app-header">
      <h1>
        📺 Mi Tele
        <span class="badge-live">En Vivo</span>
      </h1>
      <span style="font-size: 1.15rem; color: #94a3b8; font-weight: 700;">Tocá el canal que quieras ver</span>
    </header>

    <section class="channels-grid" id="channels-container">
      <!-- Generado dinámicamente -->
    </section>
  </main>

  <!-- ==================== VISTA DE REPRODUCTOR (100% EN PÁGINA) ==================== -->
  <section id="view-player">
    <div class="video-container" id="video-wrapper">
      
      <!-- Video HLS Nativo -->
      <video id="tv-video" playsinline webkit-playsinline></video>

      <!-- Cartel de carga -->
      <div class="loading-spinner" id="player-loading">
        <div class="spinner"></div>
        <span id="loading-text">Conectando canal...</span>
      </div>

      <!-- Tarjeta de aviso si una señal tiene restricción externa de emisión -->
      <div class="channel-notice-card" id="channel-notice">
        <h2 id="notice-title">Señal no disponible en web</h2>
        <p id="notice-desc">Esta señal requiere sintonización directa.</p>
        <button class="btn-giant" id="btn-notice-retry" style="font-size: 1.3rem; min-height: 60px;">
          🔄 Reintentar conexión
        </button>
      </div>

      <!-- Capa de controles sobreimpresos -->
      <div class="player-overlay" id="player-overlay">
        <!-- Parte Superior: Botón Volver gigante en esquina izquierda -->
        <div class="overlay-top">
          <button class="btn-giant" id="btn-back">
            ⬅ VOLVER
          </button>
          
          <div class="current-channel-info">
            <span class="badge-live">VIVO</span>
            <span class="current-channel-name" id="player-channel-name">Canal</span>
          </div>
        </div>

        <!-- Parte Inferior: Menú Directo de los 6 Canales en Pantalla -->
        <div class="overlay-bottom">
          <span class="channel-menu-label">Tocá para cambiar de canal:</span>
          <div class="channel-selector-bar" id="channel-selector-bar">
            <!-- 6 botones directos generados automáticamente -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    /* ==========================================================================
       CONFIGURACIÓN DE LOS 6 CANALES (STREAMS DIRECTOS)
       ========================================================================== */
    const CHANNELS = [
      {
        id: "tn",
        name: "TN",
        subtitle: "Todo Noticias",
        themeClass: "card-tn",
        hlsUrl: "https://live-01-01-tn.vodgc.net/TN24/index.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0b2545"/>
            <path d="M15 15 L85 15 L60 85 L15 85 Z" fill="#e65c00" opacity="0.3"/>
            <text x="50" y="65" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">TN</text>
          </svg>
        `
      },
      {
        id: "telefe",
        name: "Telefe",
        subtitle: "Canal 11",
        themeClass: "card-telefe",
        hlsUrl: "https://siloh-mcdn.plutotv.net/lilo/production/LATAM/Telefe/master.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="28" cy="50" r="18" fill="#2563eb" />
            <circle cx="50" cy="50" r="18" fill="#16a34a" />
            <circle cx="72" cy="50" r="18" fill="#dc2626" />
            <text x="50" y="86" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">telefe</text>
          </svg>
        `
      },
      {
        id: "c5n",
        name: "C5N",
        subtitle: "Noticias 24hs",
        themeClass: "card-c5n",
        hlsUrl: "https://c5n-live.vodgc.net/c5n/live/playlist.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#991b1b"/>
            <text x="50" y="66" font-family="sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">C5N</text>
          </svg>
        `
      },
      {
        id: "eltrece",
        name: "El Trece",
        subtitle: "Canal 13",
        themeClass: "card-eltrece",
        hlsUrl: "https://livetrx01.vodgc.net/eltrecetv/index.m3u8",
        fallbackHls: "https://live-01-01-eltrece.vodgc.net/eltrecetv/index.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="#581c87"/>
            <circle cx="50" cy="50" r="28" fill="#ea580c"/>
            <circle cx="50" cy="50" r="15" fill="#facc15"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">el trece</text>
          </svg>
        `
      },
      {
        id: "tvpublica",
        name: "TV Pública",
        subtitle: "Canal 7",
        themeClass: "card-tvpublica",
        hlsUrl: "https://ola1.com.ar/tvp/index.m3u8",
        fallbackHls: "https://cntlnk-main-edge-access.secure.footprint.net/entrypoint/c7_vivo01_dai_source-20001_all.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#0369a1"/>
            <rect x="0" y="35" width="100" height="30" fill="#ffffff"/>
            <circle cx="50" cy="50" r="11" fill="#f59e0b"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">TV PÚBLICA</text>
          </svg>
        `
      },
      {
        id: "canalrural",
        name: "Canal Rural",
        subtitle: "El campo en vivo",
        themeClass: "card-canalrural",
        hlsUrl: "http://200.91.32.158:8080/rural/index.m3u8",
        logoSvg: `
          <svg viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#14532d"/>
            <path d="M50 20 C65 35 65 65 50 80 C35 65 35 35 50 20 Z" fill="#84cc16"/>
            <text x="50" y="88" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">RURAL</text>
          </svg>
        `
      }
    ];

    /* ==========================================================================
       FILTRO DE TEMBLOR ESENCIAL (DEBOUNCE 650ms + TOLERANCIA A ARRASTRE)
       ========================================================================== */
    let lastTapTime = 0;
    const TREMOR_DEBOUNCE_MS = 650;
    let touchStartX = 0;
    let touchStartY = 0;

    function isIntentionalTap(event) {
      const now = Date.now();
      if (now - lastTapTime < TREMOR_DEBOUNCE_MS) {
        return false;
      }
      lastTapTime = now;
      if (navigator.vibrate) {
        navigator.vibrate(60);
      }
      return true;
    }

    /* ==========================================================================
       CONSTRUCCIÓN DE LA GRILLA PRINCIPAL
       ========================================================================== */
    const container = document.getElementById("channels-container");
    CHANNELS.forEach((channel, index) => {
      const card = document.createElement("div");
      card.className = `channel-card ${channel.themeClass}`;
      card.innerHTML = `
        <div class="logo-container">${channel.logoSvg}</div>
        <div class="channel-title">${channel.name}</div>
        <div class="channel-subtitle">${channel.subtitle}</div>
      `;

      card.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        card.classList.add("is-pressed");
      }, { passive: true });

      card.addEventListener("touchend", (e) => {
        card.classList.remove("is-pressed");
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const dist = Math.hypot(touchEndX - touchStartX, touchEndY - touchStartY);
        if (dist < 35 && isIntentionalTap(e)) {
          openChannel(index);
        }
      });

      card.addEventListener("click", (e) => {
        if (isIntentionalTap(e)) {
          openChannel(index);
        }
      });

      container.appendChild(card);
    });

    /* ==========================================================================
       CONSTRUCCIÓN DEL MENÚ INFERIOR DIRECTO DE CANALES
       ========================================================================== */
    const channelBar = document.getElementById("channel-selector-bar");
    CHANNELS.forEach((channel, index) => {
      const btn = document.createElement("button");
      btn.className = `btn-channel-select ${channel.themeClass}`;
      btn.id = `btn-bar-${channel.id}`;
      btn.textContent = channel.name;

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (isIntentionalTap(e)) {
          openChannel(index);
          resetOverlayTimer();
        }
      });

      channelBar.appendChild(btn);
    });

    /* ==========================================================================
       LÓGICA DEL REPRODUCTOR
       ========================================================================== */
    let currentIndex = 0;
    let hlsInstance = null;
    let overlayTimeout = null;

    const viewHome = document.getElementById("view-home");
    const viewPlayer = document.getElementById("view-player");
    const video = document.getElementById("tv-video");
    const playerLoading = document.getElementById("player-loading");
    const loadingText = document.getElementById("loading-text");
    const channelNotice = document.getElementById("channel-notice");
    const noticeTitle = document.getElementById("notice-title");
    const noticeDesc = document.getElementById("notice-desc");
    const btnNoticeRetry = document.getElementById("btn-notice-retry");
    const playerOverlay = document.getElementById("player-overlay");
    const playerChannelName = document.getElementById("player-channel-name");
    const btnBack = document.getElementById("btn-back");

    function showLoading(text) {
      loadingText.textContent = text;
      playerLoading.style.display = "flex";
      channelNotice.style.display = "none";
    }

    function hideLoading() {
      playerLoading.style.display = "none";
    }

    function resetOverlayTimer() {
      playerOverlay.classList.remove("hidden");
      clearTimeout(overlayTimeout);
      // Mantiene los controles 6 segundos y luego los oculta para ver TV limpia
      overlayTimeout = setTimeout(() => {
        playerOverlay.classList.add("hidden");
      }, 6000);
    }

    // Tocar cualquier parte de la pantalla siempre muestra u oculta el menú web
    document.getElementById("video-wrapper").addEventListener("click", (e) => {
      if (playerOverlay.classList.contains("hidden")) {
        resetOverlayTimer();
      } else {
        playerOverlay.classList.add("hidden");
      }
    });

    function updateActiveButtonInBar() {
      CHANNELS.forEach((ch, idx) => {
        const btn = document.getElementById(`btn-bar-${ch.id}`);
        if (btn) {
          if (idx === currentIndex) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        }
      });
    }

    function openChannel(index) {
      currentIndex = index;
      const channel = CHANNELS[currentIndex];

      viewHome.style.display = "none";
      viewPlayer.style.display = "flex";
      playerChannelName.textContent = channel.name;
      updateActiveButtonInBar();
      resetOverlayTimer();

      playCurrentChannel();
    }

    function playCurrentChannel() {
      const channel = CHANNELS[currentIndex];
      showLoading(`Sintonizando ${channel.name}...`);
      channelNotice.style.display = "none";

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.src = "";

      if (Hls.isSupported() && channel.hlsUrl) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          manifestLoadingTimeOut: 8000
        });

        hlsInstance.loadSource(channel.hlsUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          hideLoading();
          video.play().catch(e => console.log("Autoplay:", e));
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.warn(`Error HLS en ${channel.name}:`, data);
            if (channel.fallbackHls && channel.fallbackHls !== channel.hlsUrl) {
              console.log("Probando stream de respaldo...");
              hlsInstance.loadSource(channel.fallbackHls);
            } else {
              hideLoading();
              showChannelNotice(
                `${channel.name} no emite señal web abierta`,
                `Esta cadena de televisión bloquea la transmisión hacia navegadores web debido a restricciones de derechos de autor.`
              );
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = channel.hlsUrl;
        video.addEventListener("loadedmetadata", () => {
          hideLoading();
          video.play();
        });
      } else {
        hideLoading();
        showChannelNotice("Navegador no compatible", "Tu navegador no soporta streaming HLS.");
      }
    }

    function showChannelNotice(title, desc) {
      noticeTitle.textContent = title;
      noticeDesc.textContent = desc;
      channelNotice.style.display = "flex";
    }

    btnNoticeRetry.addEventListener("click", (e) => {
      e.stopPropagation();
      playCurrentChannel();
    });

    function closePlayer() {
      clearTimeout(overlayTimeout);

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.src = "";

      viewPlayer.style.display = "none";
      viewHome.style.display = "flex";
    }

    // BOTÓN VOLVER GIGANTE
    btnBack.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isIntentionalTap(e)) {
        closePlayer();
      }
    });

    window.addEventListener("popstate", () => {
      if (viewPlayer.style.display === "flex") {
        closePlayer();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registrado'))
          .catch(err => console.log('Error de Service Worker:', err));
      });
    }
  </script>
</body>
</html>
